annotations:
  - file: "core/data/src/test/kotlin/com/google/samples/apps/nowinandroid/core/data/repository/OfflineFirstNewsRepositoryTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: boundary
    notes: |
      Exemplary behavioral test. Uses hand-written fakes (TestNewsResourceDao, TestNiaNetworkDataSource,
      TestTopicDao, TestNotifier) injected at repository boundaries. All assertions check observable
      output: data flowing through the DAO, version numbers after sync, notification state. Zero
      verify calls. Tests survive internal refactoring of sync logic as long as the contract holds.

      Tool reports: 18 assertions (14 strong, 4 medium), 100% output-targeted, 0 structural coupling,
      0 mock density, 0 fakes detected.

      The tool correctly identifies this as behavioral with zero structural coupling. However, fakeCount=0
      is a miss — there are 5 hand-written fakes (TestNewsResourceDao, TestTopicDao,
      TestNiaNetworkDataSource, TestNotifier, InMemoryDataStore). The tool does not detect
      Test*-prefixed classes as fakes. setupStatements=0 is also wrong — the @Before method has 7
      statements creating and wiring dependencies.

      The 52 unclassified statements are mostly the data transformation chains in test bodies
      (mapping network models to entities). These are test infrastructure, not a problem.
    tool_agrees: true
    disagreements:
      - signal: "doubles.fakeCount"
        tool_says: 0
        expert_says: "5 fakes (TestNewsResourceDao, TestTopicDao, TestNiaNetworkDataSource, TestNotifier, InMemoryDataStore)"
        severity: medium
        explanation: "Tool does not detect hand-written Test*-prefixed fake classes. These are constructed directly, not via a mocking framework, so the tool misses them entirely."
      - signal: "setupComplexity.setupStatements"
        tool_says: 0
        expert_says: "7 statements in @Before setup()"
        severity: low
        explanation: "Tool fails to count setup statements in the @Before method. The setup creates 5 fakes and wires them into the subject. This is low complexity for a repository test but should not be 0."

