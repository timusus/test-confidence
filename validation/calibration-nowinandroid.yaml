  - file: "core/designsystem/src/test/kotlin/com/google/samples/apps/nowinandroid/core/designsystem/ThemeTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Compose theme configuration test using Robolectric. Sets NiaTheme with various parameter
      combinations (darkTheme, disableDynamicTheming, androidTheme) and asserts that the correct
      ColorScheme, GradientColors, BackgroundTheme, and TintTheme are applied via composition
      locals.

      Tool reports: 8 assertions (all medium), 100% output, 0 structural coupling, Compose test
      detected, Robolectric detected. This is correct.

      The tool correctly identifies this as a Compose test under Robolectric. The 8 detected
      assertions seem low — each test method calls assertColorSchemesEqual (which has ~23
      assertEquals calls inside) plus 3 more assertEquals calls, totaling ~26 assertions per
      test and ~200+ total. The tool only counts 8, likely counting one per test method or
      only the top-level assertEquals calls, missing the ones inside the helper method.

      This is a significant assertion count undercount for Compose tests that use helper methods.
    tool_agrees: true
    disagreements:
      - signal: "assertions.totalAssertions"
        tool_says: 8
        expert_says: "~208 (8 tests x ~26 assertions each, including assertColorSchemesEqual helper)"
        severity: high
        explanation: "The tool counts only direct assertEquals calls in test methods, not assertions inside helper methods called from tests. assertColorSchemesEqual contains 23 assertEquals calls but is counted as 0 or 1. This severely undercounts assertion density for well-factored tests."
