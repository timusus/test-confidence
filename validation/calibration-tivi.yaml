  - file: "data/test/src/commonTest/kotlin/app/tivi/data/repositories/SeasonsEpisodesRepositoryTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: boundary
    notes: >
      Expert: Repository integration test using real database + fake data sources
      (via ObjectGraph helper). Tests sync operations: initial sync, idempotent
      sync, deletion of missing items, empty responses, and a Flow-based test
      using Turbine. The Turbine test (testObserveNextEpisodeToWatch_singleFlow)
      is particularly interesting -- it tests reactive behavior by watching a
      Flow, marking an episode as watched, and verifying the next episode
      updates. All fakes are at the network boundary. High confidence.

      Tool output: behavioral=100%, structuralCouplingScore=0, fakeCount=0,
      16 assertions (15 Strong, 1 Medium), scope=Local, setupComplexity=0.

      Assessment: The tool reports fakeCount=0, which is WRONG. The test uses
      multiple fake data sources (traktSeasonsEpisodesDataSource,
      episodeWatchesDataSource, traktAuthRepository with fake auth) via the
      ObjectGraph helper. These are all fakes at the network boundary. The tool
      misses them because they are accessed through a delegated property
      (objectGraph.traktSeasonsEpisodesDataSource) rather than declared
      directly in the test file.

      Assertion count: Tool says 16, I count 17. The discrepancy is in the
      Turbine test block. The .test { } lambda contains 2 assertThat calls
      but the text-based fallback counts the entire block as a single
      assertion (it sees one statement containing "assertThat("). This is a
      Turbine detection issue -- the tool should count individual assertions
      inside Turbine test blocks.

      The 1 Medium assertion is likely from the Turbine block (text fallback
      defaults to Medium). The 15 Strong are the direct assertThat chains
      with containsExactly/isEqualTo/isEmpty.
    tool_agrees: false
    disagreements:
      - signal: "fake_count"
        tool_says: "fakeCount=0, no doubles detected"
        expert_says: "Test uses at least 3 fake data sources (FakeSeasonsEpisodesDataSource x2, FakeEpisodeWatchesDataSource) plus fake auth, all at boundary. Tool misses them because they're accessed via ObjectGraph delegated properties, not declared in the test file."
        severity: "significant (completely misses the test's dependency injection strategy)"
      - signal: "assertion_count"
        tool_says: "16 assertions"
        expert_says: "17 assertions. The Turbine .test { } block contains 2 assertThat calls but the text-based fallback counts the entire block as 1 assertion."
        severity: "minor (off by 1 due to Turbine lambda nesting)"
      - signal: "assertion_strength"
        tool_says: "1 Medium assertion (from Turbine block fallback)"
        expert_says: "The 2 assertions inside Turbine's .test {} are both isEqualTo (Strong), but the fallback classifies the whole block as Medium."
        severity: "minor (Turbine assertions get downgraded strength)"

