annotations:
  - file: "data/test/src/commonTest/kotlin/app/tivi/data/dao/EpisodesTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: >
      Expert: DAO test for episodes table. Tests CRUD operations and cascade
      delete (deleting a season deletes its episodes). Uses assertk for
      assertions and kotlin.test assertFails for constraint violation.
      All assertions verify query results. No doubles -- operates against
      a real database instance. Very high confidence, purely behavioral.

      Tool output: behavioral=100%, structuralCouplingScore=0, fakeCount=0,
      5 assertions (2 Strong, 3 Medium), scope=Local, setupComplexity=0.

      Assessment: Assertion count of 5 matches my manual count (4 assertThat
      chains + 1 assertFails). However, there are strength classification
      issues:
      1. assertFails is classified as Medium/Output. It should be Strong/Exception
         (same as assertFailsWith and assertThrows). The assertFails function
         IS in the exception-assertion family.
      2. isNull() from assertk is classified as Medium (default). It should be
         Weak to match assertNull classification. isNull tests for nullity,
         same as assertNull which is Weak.
    tool_agrees: true
    disagreements:
      - signal: "assertion_strength"
        tool_says: "assertFails classified as Medium strength, Output target"
        expert_says: "assertFails (from kotlin.test) is functionally identical to assertThrows/assertFailsWith. Should be Strong strength, Exception target. Missing from exceptionAssertions map in assertions.go."
        severity: "moderate (misclassifies exception assertions from kotlin.test)"
      - signal: "assertion_strength"
        tool_says: "isNull() classified as Medium strength"
        expert_says: "assertk's isNull() should be Weak, matching the same tier as assertNull. Currently not in weakAssertions map."
        severity: "minor (consistent underweight of null-check assertions)"

