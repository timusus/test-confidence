  - file: "data/src/test/kotlin/com/bitwarden/data/manager/appstate/AppStateManagerTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: boundary
    notes: >
      Expert: Tests AppStateManagerImpl with 2 test methods (98 lines). Uses
      Turbine flow testing (.test { awaitItem() }) to verify reactive state
      transitions. Test 1: appForegroundStateFlow emits BACKGROUNDED (initial),
      FOREGROUNDED (on start), BACKGROUNDED (on stop) -- uses FakeLifecycleOwner
      to drive lifecycle events. Test 2: appCreatedStateFlow emits Destroyed
      (initial), Created(isAutoFill=false) on activity create, Destroyed when
      all activities destroyed -- uses captured ActivityLifecycleCallbacks via
      MockK slot/capture. Both tests use assertEquals on awaitItem() which is
      purely behavioral (testing flow output). The Application mock is only used
      to capture the callbacks (setupOnly). FakeLifecycleOwner is a hand-written
      fake. mockkStatic is used for an extension property (createdForAutofill).

      Tool output: totalAssertions=6, behavioralMethods=2, structuralMethods=0,
      outputInteractionRatio=1.0, fakeCount=1 (FakeLifecycleOwner=Boundary),
      1 Activity mock (SetupOnly/Boundary), mockDensity=0.14,
      structuralCouplingScore=0.6, setupComplexity ratio=1.17.

      Assessment: Tool correctly identifies this as fully behavioral. Assertion
      count of 6 matches manual count: test 1 has 3 assertEquals(awaitItem()),
      test 2 has 3 assertEquals(awaitItem()). All 6 are classified as Medium
      strength. However, assertEquals comparing enum values (AppForegroundState.
      BACKGROUNDED) and data class instances (AppCreationState.Created(isAutoFill
      =false)) should arguably be Strong (exact equality on meaningful values),
      not Medium. The tool detects FakeLifecycleOwner correctly as a fake.
      Application mock is correctly classified as SetupOnly (it is only used
      to capture callbacks via slot, never verified). The slot/capture pattern
      is an advanced MockK feature used here to intercept registration --
      the tool handles this correctly by not flagging it as structural coupling.

      One issue: the tool misses the mockkStatic(Activity::createdForAutofill)
      in @BeforeEach. This is a static mock of an extension property, which is
      a form of test double. The tool does not detect mockkStatic as a double
      declaration. This is a known limitation for static mocking detection.
    tool_agrees: true
    disagreements:
      - signal: "assertion_strength"
        tool_says: "All 6 assertions classified as Medium strength"
        expert_says: "assertEquals comparing enum constants and data class instances with specific field values should be Strong. These are exact-match equality assertions on meaningful domain values, not weak existence checks."
        severity: "minor (systematic underclassification of assertEquals in Turbine test blocks)"
      - signal: "doubles_detection"
        tool_says: "2 doubles detected (FakeLifecycleOwner, Activity mock)"
        expert_says: "3 doubles: FakeLifecycleOwner, Application mock, and mockkStatic(Activity::createdForAutofill). The static mock is used in @BeforeEach/@AfterEach and provides stubbed behavior for the createdForAutofill extension property. Tool does not detect mockkStatic as a double."
        severity: "moderate (static mocks are a common MockK pattern that affects test coupling analysis)"

  - file: "authenticator/src/test/kotlin/com/bitwarden/authenticator/ui/platform/feature/rootnav/RootNavScreenTest.kt"
    behavioral: false
    structural_coupling: high
    fragile: true
    mock_placement: internal
    notes: >
      Expert: Compose navigation test (314 lines, 11 test methods) for
      RootNavScreen in the authenticator module. Tests navigation routing:
      when state changes to Splash/Tutorial/Locked/Unlocked, verify that
      navController.navigate() is called with the correct route. Also tests
      onSplashScreenRemoved callback. Uses MutableStateFlow to drive state
      changes and composeTestRule.runOnIdle { verify { ... } } pattern.

      The test has two distinct patterns:
      1. Tests with assertTrue/assertFalse on onSplashScreenRemovedCalled
         (3 tests) -- these are behavioral, testing callback invocation via
         a boolean flag.
      2. Tests with verify { navController.navigate(route=X) } (8 tests) --
         these are structural, verifying that a specific method was called
         with specific arguments. They test HOW routing works, not WHAT
         the user sees.

      Of the 11 test methods, 5 are transition tests (e.g., "Splash to
      Tutorial") that contain ONLY verify calls and no output assertions.
      The tool correctly identifies these 5 as zeroAssertionMethods.

      Tool output: totalAssertions=7, behavioralMethods=6,
      structuralMethods=0, unclassifiedMethods=5, 5 zeroAssertionMethods,
      outputInteractionRatio=1.0, mockDensity=0, structuralCouplingScore=0.

      Assessment: Several disagreements here.

      1. structuralMethods=0 is WRONG. The verify { navController.navigate() }
      calls in 8 of 11 tests are structural interaction assertions. The tool
      appears to not detect verify calls inside composeTestRule.runOnIdle { }
      blocks. This is a significant detection gap -- the verify calls are
      real and structurally couple the test to navigation implementation.

      2. mockDensity=0 is WRONG. The file creates mockk<RootNavViewModel>,
      mockk<BiometricsManager>, and uses createMockNavHostController(). These
      are 3 mock declarations. The tool appears to miss mocks declared at
      class level with inline every { } blocks.

      3. structuralCouplingScore=0 is WRONG given the heavy verify usage.
      This should be elevated due to 8 tests containing verify calls.

      4. The 5 zeroAssertionMethods are correctly identified -- these
      transition tests (lines 165-308) contain only verify blocks and no
      assertTrue/assertFalse calls.

      5. behavioralMethods=6 overcounts. Only 3 tests are behavioral
      (the assertTrue/assertFalse callback tests). The other 3 that the tool
      counts as behavioral actually contain verify calls alongside
      assertTrue/assertFalse, making them mixed at best.

      6. unclassifiedMethods=5 is better understood as structural --
      these 5 methods have verify-only behavior but are marked unclassified
      because the tool does not see the verify calls at all.
    tool_agrees: false
    disagreements:
