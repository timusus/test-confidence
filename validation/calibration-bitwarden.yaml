        tool_says: "structuralMethods=0, no structural coupling detected"
        expert_says: "8 of 11 tests contain verify { navController.navigate(route=X, navOptions=Y) } calls, which are structural interaction assertions. The verify calls are inside composeTestRule.runOnIdle { } blocks, which the tool apparently does not scan for verify patterns."
        severity: "critical (completely misses structural coupling in Compose test pattern)"
