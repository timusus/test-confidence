annotations:
  - file: "ui/src/test/kotlin/com/bitwarden/ui/platform/manager/exit/ExitManagerTest.kt"
    behavioral: false
    structural_coupling: high
    fragile: true
    mock_placement: internal
    notes: >
      Expert: Tiny test (28 lines, 1 test method) for ExitManager. Mocks
      Activity, stubs finishAndRemoveTask() to run, calls exitApplication(),
      then verify(exactly=1) { activity.finishAndRemoveTask() }. This is a
      textbook verify-only test: it asserts HOW the method works (calls
      finishAndRemoveTask) rather than WHAT it produces. There is no output
      assertion. The test is structurally coupled to the implementation -- if
      ExitManagerImpl changes to use finish() instead of finishAndRemoveTask(),
      the test breaks even though the behavior (exit the app) is preserved.
      Activity is an Android framework class, not a boundary dependency, so
      mock placement is internal (mocking the framework itself).

      Tool output: totalAssertions=0, behavioralMethods=0, structuralMethods=1,
      1 VerifyOnlyTest finding, mockDensity=0.25, structuralCouplingScore=30,
      scope=Local.

      Assessment: Tool correctly identifies this as structural (0 behavioral,
      1 structural method). The VerifyOnlyTest finding is accurate -- this test
      has zero output assertions and only uses verify. structuralCouplingScore
      of 30 is appropriate for a fully verify-only file. However, the doubles
      detection is incomplete: the tool reports mockDensity=0.25 but does not
      list any doubles in the doubles array. The Activity mock is created via
      mockk { every { ... } just runs } at the class level and should appear
      as a detected double. Also, mock placement should be flagged as internal
      (Activity is a framework class, not a boundary type), but the tool does
      not report placement at all for this file.
    tool_agrees: true
    disagreements:
      - signal: "doubles_detection"
        tool_says: "mockDensity=0.25 but no doubles listed in the doubles array"
        expert_says: "Activity mock is declared at class level via mockk<Activity> { }. Should appear as a double with typeName=Activity, usage=Verified, placement=Internal. The doubles array is empty despite mockDensity being nonzero."
        severity: "moderate (mock exists and is counted for density but not enumerated)"
      - signal: "mock_placement"
        tool_says: "No placement reported for Activity mock"
        expert_says: "Activity is an Android framework class, not a boundary dependency. Should be classified as Internal placement. Mocking framework internals is a fragility indicator."
        severity: "moderate (missing placement signal for framework mock)"

