        expert_says: "Only 3 tests are purely behavioral (the callback flag tests with assertTrue/assertFalse only). The other 3 counted as behavioral also contain verify calls, making them mixed. The 5 unclassified should be structural."
        severity: "significant (overcount of behavioral due to missed verify detection)"

