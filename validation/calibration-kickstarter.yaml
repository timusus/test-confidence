# Calibration: Kickstarter Android
# Codebase: /tmp/kickstarter-android
# Date: 2026-03-21
# Tool version: confidence (current main branch)
#
# This codebase uses MockK, Mockito, Compose UI testing (composeTestRule),
# RxJava TestSubscriber, hand-written fakes (MockApolloClientV2, MockFeatureFlagClient,
# MockCurrentUserV2), and factory builders (ProjectFactory, UserFactory, etc.).
# Some files use BOTH MockK and Mockito simultaneously.
# Tests extend KSRobolectricTestCase (Robolectric base class).

annotations:
  - file: "app/src/test/java/com/kickstarter/libs/FeatureFlagClientTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: boundary
    notes: >
      Expert: 6 test methods testing FeatureFlagClient behavior -- fetch interval
      selection (release vs debug), and typed getters (getBoolean, getLong, getDouble,
      getString) with both initialized and null Firebase states. Uses MockK exclusively.
      All doubles are setup-only stubs: FirebaseRemoteConfig (stubbed to return values)
      and Build (stubbed for isDebug/isInternal). Every test asserts the return value
      via assertEquals -- purely output-based. No verify calls anywhere. The doubles
      are boundary: FirebaseRemoteConfig is an external service, Build is a platform
      abstraction. Well-structured, low coupling.

      Tool output: 6 behavioral methods, 0 structural, 10 assertions (all Strong),
      outputInteractionRatio=1.0, structuralCouplingScore=4.7, 12 doubles
      (all MockK/SetupOnly/Boundary), fakeCount=0, mockDensity=0.45.

      Assessment: Classification is correct -- all behavioral, all setup-only.
      Assertion count of 10 matches manual count (testGetIntervalRelease=1,
      testGetIntervalDebug=1, testGetBoolean=2, testGetLong=2, testGetDouble=2,
      testGetString=2). Placement as Boundary for both FirebaseRemoteConfig and
      Build is correct. The structuralCouplingScore of 4.7 seems slightly elevated
      for a file with zero structural indicators; this may be driven by the high
      mockDensity (0.45) from having 2 mocks per test method. The tool counts
      each per-method declaration as a separate double (12 total for 6 methods x
      2 types), which inflates mockDensity but accurately reflects the file's
      repetitive mock creation pattern. Minor: Build could arguably be "Internal"
      since it is an app-level abstraction, not a true external boundary.
    tool_agrees: true
    disagreements:
      - signal: "mock_placement"
        tool_says: "Build classified as Boundary"
        expert_says: "Build is an app-level configuration object, not a network/database/platform boundary. It would be more accurate as Internal. FirebaseRemoteConfig as Boundary is correct."
        severity: "minor (Build is a borderline case; it wraps BuildConfig which is a build-system artifact)"
      - signal: "structural_coupling_score"
        tool_says: "structuralCouplingScore=4.7"
        expert_says: "With zero verify calls, zero argument captors, and 100% output assertions, this file has no structural coupling indicators. The 4.7 score appears driven solely by mockDensity. A file that only stubs and asserts outputs should score near zero."
        severity: "minor (score is low enough not to trigger worst-files, but the principle matters)"

  - file: "app/src/test/java/com/kickstarter/ui/compose/designsystem/videoplayer/KSVideoPlayerTest.kt"
    behavioral: false
    structural_coupling: high
    fragile: true
    mock_placement: boundary
    notes: >
      Expert: 12 test methods for a video player Compose component. Mixed file with
      two distinct testing strategies:

      (A) Matrix math tests (7 methods, lines 40-139): Test applyZoomMatrix extension
      function on TextureView. Use Mockito mock of TextureView and ArgumentCaptor for
      Matrix. Three guard-clause tests use verify(never()).setTransform(any()) -- these
      are verify-only. The "Perfect aspect ratio match" test uses verify(setTransform(null)).
      Three ArgumentCaptor tests extract the Matrix and assert on scale values and
      mapped points -- these are structural BUT contain real content assertions on the
      captured values (scaleX > 1.0, assertEquals scaleY, mapped point assertions).

      (B) Compose UI tests (5 methods, lines 141-260): Test video player UI interactions
      using composeTestRule. These mix Compose assertions (assertIsDisplayed,
      assertDoesNotExist) with Mockito verify calls (verify(mockPlayer).pause(),
      verify(mockPlayer).play(), verify(mockPlayer).seekTo(...)). The verify calls
      here test real behavioral contracts -- "did tapping pause actually call pause()?"
      This is a legitimate use of verify for command methods on an external player.

      Tool output: 1 behavioral, 11 structural, 10 assertions, 13 Interaction,
      structuralCouplingScore=28.6, 4 VerifyOnlyTest findings, 3 ArgumentCaptor
      findings. TextureView mock in @Before counted once.

      Assessment: The tool overcounts structural methods. The 3 ArgumentCaptor tests
      (lines 78, 102, 123) DO contain real assertions on captured values (assertEquals,
      assert(scaleX > 1.0)), so classifying them as purely structural understates their
      value. The tool correctly flags them as ArgumentCaptor usage but should
      recognize that post-capture assertions add behavioral value.

      For Compose UI tests: The tool counts verify(mockPlayer).pause/play/seekTo as
      Interaction targets, making these methods structural. However, ExoPlayer.pause(),
      .play(), and .seekTo() are command methods on an external media player -- verifying
      them IS the behavioral contract for a UI control. The tool correctly identifies
      these as verify calls but cannot distinguish "verify on a command method at a
      boundary" from "verify on an internal implementation detail."

      The "testTag" detected as a Fake (framework=Fake, usage=FakeUsage) is a
      false positive -- `val testTag = "overlay_test_tag"` is just a string constant
      used as a Compose test tag, not a test double.

      VerifyOnlyTest flags on guard-clause tests (lines 40, 49, 58) are technically
      correct -- these tests only verify that setTransform was NOT called. But
      verify(never()) for guard clauses is an accepted testing pattern. The tool
      cannot distinguish "verify-only because the test is lazy" from "verify-only
      because the behavior IS not-calling-something."
    tool_agrees: false
    disagreements:
      - signal: "behavioral_vs_structural_classification"
        tool_says: "1 behavioral, 11 structural"
        expert_says: >
          More nuanced breakdown: 3 guard-clause tests are verify-only (acceptable
          pattern), 1 aspect-ratio match test is verify-only, 3 ArgumentCaptor tests
          contain real content assertions on captured values (partially behavioral),
          5 Compose tests mix UI assertions with command-method verify calls.
          A fairer split: ~5 behavioral (Compose UI + string overlay), ~4 mixed
          (ArgumentCaptor with assertions), ~3 structural (guard clauses + aspect
          ratio match). The 11 structural count overstates fragility.
        severity: "significant (11/12 structural makes this look much worse than it is)"
      - signal: "verify_on_command_methods"
        tool_says: "verify(mockPlayer).pause/play/seekTo counted as Interaction (structural)"
        expert_says: >
          ExoPlayer is an external media player API. Verifying that pause(), play(),
          and seekTo() were called IS the behavioral contract for UI controls that
          delegate to a player. These are command methods at a boundary, not internal
          implementation details. The tool has no way to distinguish this currently.
        severity: "moderate (affects all tests that verify command methods on boundary objects)"
      - signal: "false_positive_fake"
        tool_says: "testTag detected as Fake (framework=Fake, usage=FakeUsage)"
        expert_says: "val testTag = \"overlay_test_tag\" is a plain string constant used as a Compose testTag identifier, not a test double."
        severity: "minor (inflates fakeCount by 1)"
      - signal: "assertion_count"
        tool_says: "totalAssertions=10"
        expert_says: >
          Manual count yields ~23 assertions: 3x verify(never()), 1x verify(null),
          3x verify+capture with ~5 post-capture asserts, plus Compose: ~8
          assertIsDisplayed/assertDoesNotExist, plus verify(pause/play/seekTo x5).
          The tool appears to count only assertEquals/assertTrue/assert() calls (10)
          and misses Compose assertions counted elsewhere, or counts verify as
          Interaction rather than as assertions. The 10 + 13 Interaction = 23 total
          aligns if we consider verify calls as non-assertion interactions.
        severity: "minor (the Output vs Interaction split captures the data, just categorized differently)"

  - file: "app/src/test/java/com/kickstarter/viewmodels/ProjectPageViewModelTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: boundary
    notes: >
      Expert: 106 test methods in a large ViewModel test (2648 lines). This is the
      KEY CALIBRATION TARGET because it uses BOTH MockK and Mockito in the same file.

      Primary pattern: The vast majority (~100 methods) follow a consistent structure:
      1. Build a project/user/environment using Factory builders and hand-written fakes
         (MockApolloClientV2, MockFeatureFlagClient, MockCurrentUserV2)
      2. Call setUpEnvironment() which wires up RxJava TestSubscriber observers
      3. Trigger inputs (configureWith, button clicks, activity results)
      4. Assert outputs via TestSubscriber.assertValue/assertValues/assertNoValues

      This is a behavioral test pattern: input -> observe output via reactive streams.
      The TestSubscribers act as output collectors, not mocks.

      MockK usage (1 method): addUserToSecretRewardGroup_isCalled_whenDeeplinkContainsSecretToken
      (line 2378) uses spyk() on a MockApolloClientV2 and coVerify{} with slot/capture
      to verify a suspend function was called with correct arguments. This single test
      IS structural -- it verifies an interaction rather than an output.

      Mockito usage (3 occurrences): SharedPreferences is mocked with Mockito.mock()
      and Mockito.when() for consent management tests (lines 501, 531, 561). These
      are setup-only stubs -- no Mockito.verify() calls on them. SharedPreferences is
      a boundary type (Android platform storage).

      Tool output: 102 behavioral, 1 structural, 263 assertions,
      outputInteractionRatio=0.996, structuralCouplingScore=10.2. Detects both
      Mockito (SharedPreferences) and MockK (via coVerify/spyk/slot). Flags
      GodTestClass (106 methods) and 8 ConditionalLogic findings.

      Assessment: The tool correctly identifies this as overwhelmingly behavioral
      (102/103 classified methods). It correctly detects BOTH frameworks: Mockito
      for SharedPreferences (SetupOnly) and MockK via the spyk/coVerify test.
      The 1 structural method (ArgumentCaptor on line 2384) correctly identifies
      the slot/capture usage.

      However, the tool classifies TestSubscriber as Fake (54 instances), which
      inflates fakeCount. TestSubscriber is a test utility for observing reactive
      streams -- it is closer to an assertion helper than a test double. It does
      not replace a production dependency.

      ConditionalLogic findings: The tool flags `when (flagKey)` expressions inside
      anonymous MockFeatureFlagClient overrides as conditional logic (lines 2505,
      2546, 2567, 2589, 2613). These are NOT conditional test logic -- they are
      the IMPLEMENTATION of a fake's behavior (returning different values for
      different feature flags). This is a false positive. Similarly, the when{}
      blocks in MockApolloClientV2 overrides (lines 734, 744, 847) use a captured
      `var error` to simulate failure/success sequences -- this IS conditional
      test logic but it is a deliberate error-simulation pattern, not a test smell.

      The tool correctly detects both Mockito and MockK frameworks in the same
      file, which is the primary calibration question. Framework detection: PASS.
      Usage classification: Mockito doubles are correctly SetupOnly; MockK spyk
      correctly triggers the ArgumentCaptor/structural finding.
    tool_agrees: true
    disagreements:
      - signal: "conditional_logic_false_positives"
        tool_says: "8 ConditionalLogic findings including when(flagKey) in fake overrides"
        expert_says: >
          5 of 8 ConditionalLogic findings (lines 2505, 2546, 2567, 2589, 2613) are
          inside anonymous MockFeatureFlagClient.getBoolean() overrides. The when(flagKey)
          expression is the implementation of a fake -- it defines what the fake returns
          for each flag. This is not conditional test logic; it is fake behavior definition.
          The tool should not flag `when` expressions inside anonymous class/object
          override methods that implement fake behavior.
        severity: "significant (5 false positives inflate the anti-pattern count)"
      - signal: "conditional_logic_borderline"
        tool_says: "ConditionalLogic at lines 734, 744 (when { error -> ... })"
        expert_says: >
          These use a captured `var error` to toggle between error and success responses
          in a MockApolloClientV2 override. This IS conditional logic in a test, but it
          is a deliberate pattern for testing retry/recovery behavior. The test changes
          error=false and calls reloadProjectContainerClicked() to verify recovery.
          Flagging this is technically correct but the severity should be lower --
          it is a controlled state machine for testing error recovery.
        severity: "minor (technically correct but low severity; the pattern is intentional)"
      - signal: "fake_classification"
        tool_says: "54 fakes detected (44 TestSubscriber + 10 TestScheduler)"
        expert_says: >
          TestSubscriber is an RxJava test utility for subscribing to observables
          and collecting/asserting emitted values. It is an assertion helper, not
          a test double that replaces a production dependency. TestScheduler is a
          time-control utility. Neither should count toward fakeCount. The real
          fakes are MockApolloClientV2, MockFeatureFlagClient, MockCurrentUserV2,
          and MockCurrentConfigV2 -- hand-written fakes used via anonymous object
          overrides. The tool detects MockApolloClientV2 as ManualMock (1 instance)
          but misses the many anonymous overrides of MockApolloClientV2 and
          MockFeatureFlagClient created inline in individual tests.
        severity: "moderate (fakeCount=54 is misleading; real fakes are ~4 types used ~50 times)"
      - signal: "god_test_class"
        tool_says: "GodTestClass anti-pattern flagged"
        expert_says: >
          Correct. 106 test methods in one file is a god class. The ViewModel itself
          has many responsibilities (project loading, pledging, sharing, deep linking,
          media, tabs, etc.) which drives the large test class. This finding is valid.
        severity: "none (tool is correct)"

  - file: "app/src/test/java/com/kickstarter/ui/activities/compose/LoginToutScreenTest.kt"
    behavioral: true
    structural_coupling: none
    fragile: false
    mock_placement: none
    notes: >
      Expert: 4 test methods for a Compose login screen. Pure UI component testing
      with zero test doubles. Tests verify:
      1-2. Component visibility for two feature flag states (assertIsDisplayed,
           assertTextEquals, assertDoesNotExist)
      3. Options menu display/dismiss behavior (performClick -> assertIsDisplayed)
      4. Click action callbacks via counter variables (performClick -> assertEquals count)

      All assertions are output-based: checking what is displayed, what text is shown,
      and whether callbacks fire. The callback-counter pattern in testClickActionsWork
      is particularly clean -- it passes lambdas that increment counters, then asserts
      the count. No mocks, no stubs, no fakes. Compose UI testing at its best.

      Tool output: 4 behavioral, 0 structural, 45 assertions (7 Strong, 38 Medium),
      structuralCouplingScore=0, mockDensity=0, fakeCount=0, scope=Local.
      3 AssertionRoulette findings.

      Assessment: Classification is spot-on. The tool correctly identifies this as
      purely behavioral with zero coupling. The 45 assertion count is plausible
      (manual count: ~9 assertIsDisplayed + ~4 assertTextEquals + ~4 assertDoesNotExist +
      ~7 assertEquals + ~8 more assertIsDisplayed/assertTextEquals in second test +
      more in options menu test). The count includes Compose assertion matchers which
      the tool correctly counts.

      AssertionRoulette findings (3 methods) are debatable. The first two tests
      (testComponentsVisible_featureFlag_Off/On) have many assertions but they are
      testing a single concept: "all expected components are visible with correct text."
      This is a common Compose UI testing pattern -- you render the screen once and
      check everything. Splitting these into separate test methods would mean
      re-rendering the Compose content for each assertion, which is wasteful. The
      third finding (testOptionsMenuGetsDisplayed) similarly checks multiple menu
      items after a single click. These are valid observations but not necessarily
      actionable for Compose UI tests.
    tool_agrees: true
    disagreements:
      - signal: "assertion_roulette"
        tool_says: "3 methods flagged for AssertionRoulette"
        expert_says: >
          Technically correct: the first two tests have 12+ assertions each without
          descriptive messages. However, for Compose UI screen tests, the pattern of
          rendering once and checking all components is standard practice. Each assertion
          targets a different UI node identified by its test tag, so failures are
          self-documenting (the tag name tells you which component failed). This is
          a low-severity finding for Compose UI tests specifically.
        severity: "minor (pattern is standard for Compose UI tests; tags provide context)"

  - file: "app/src/test/java/com/kickstarter/ui/intents/ProjectIntentMapperTest.kt"
    behavioral: true
    structural_coupling: none
    fragile: false
    mock_placement: none
    notes: >
      Expert: 8 test methods testing ProjectIntentMapper -- a utility that extracts
      Project and RefTag from Android Intents. Pure behavioral tests: create an Intent
      with specific extras or URIs, pass it through the mapper, assert the output.
      Uses MockApiClientV2 and MockApolloClientV2 (hand-written fakes, not mock
      framework doubles) and RxJava TestSubscriber for collecting results.

      Tests cover: project from param extra, project from project extra (emits twice),
      project from ksr:// URI, project from https:// URI, ref tag extraction,
      null ref tag handling, and save query detection from URI. Clean, focused,
      and each test verifies a single mapping behavior.

      Tool output: 8 behavioral, 0 structural, 10 assertions (1 Strong, 8 Medium,
      1 Weak), outputInteractionRatio=1.0, structuralCouplingScore=0, mockDensity=0,
      fakeCount=0, scope=Local, setupComplexity=0.2.

      Assessment: Classification is correct -- all behavioral, zero coupling.
      Assertion count of 10 matches manual count:
      - assertValueCount(1) x4 = 4 assertions
      - assertValueCount(2) x1 = 1
      - assertEquals(refTag) x1 = 1
      - assertValueCount(1) x1 = 1
      - assertNull x1 = 1
      - assertTrue x1 = 1
      - assertFalse x1 = 1
      Total = 10. Correct.

      The fakeCount=0 is a minor miss -- MockApiClientV2 and MockApolloClientV2
      are hand-written fakes used in 4-5 tests (via the helper method
      attacheTestResultSubscriber and direct calls). These are not detected because
      they are passed as constructor arguments to static mapper methods rather than
      being declared as local variables with recognizable mock/fake patterns.
      However, this is a minor issue since the file has no mocking framework usage
      and the overall classification is correct.

      Strength distribution: The 1 Weak assertion is likely assertNull (correct
      classification). The 8 Medium are assertValueCount calls (reasonable --
      they verify count but not content). The 1 Strong is likely assertEquals
      for the ref tag value check. This distribution accurately reflects that
      most tests only check "did something emit?" rather than "what exact value
      was emitted?"
    tool_agrees: true
    disagreements:
      - signal: "fake_detection"
        tool_says: "fakeCount=0, mockDensity=0"
        expert_says: >
          MockApiClientV2 and MockApolloClientV2 are hand-written fakes used in
          this file. They are passed as arguments to ProjectIntentMapper.project()
          calls. The tool misses them because they are instantiated inline
          (MockApolloClientV2()) and passed directly without variable assignment
          in the helper method, or because the pattern does not match known mock
          framework creation patterns. These ARE doubles at the network boundary.
        severity: "minor (classification is still correct since these are setup-only fakes)"

summary:
  project: "Kickstarter Android"
  total_files_calibrated: 5
  total_test_methods: 136
  tool_accuracy_assessment: >
    Overall classification accuracy is high. The tool correctly identifies:
    - Behavioral vs structural split across all 5 files
    - Both MockK and Mockito frameworks in the same file (ProjectPageViewModelTest)
    - Compose UI assertions as output-based
    - Hand-written fakes declared as named variables
    - Setup-only mock usage (stubs without verify)
    - The single spyk/coVerify structural test among 106 behavioral tests

    Key systematic issues found:
    1. ConditionalLogic false positives on `when` expressions inside fake/mock
       override implementations (5 of 8 findings in ProjectPageViewModelTest).
       The tool cannot distinguish between conditional test logic and conditional
       fake behavior definition.
    2. TestSubscriber/TestScheduler classified as Fake doubles. These are RxJava
       test utilities, not production dependency replacements. Inflates fakeCount
       significantly in ViewModel tests.
    3. verify() on command methods at boundaries (ExoPlayer.pause/play/seekTo)
       counted as structural coupling. These verify calls ARE the behavioral
       contract for command-delegation patterns.
    4. String constants (val testTag = "...") detected as Fake doubles.
    5. Hand-written fakes passed as inline constructor arguments are missed
       by the doubles detector.

  dual_framework_detection: >
    PRIMARY CALIBRATION QUESTION: Can the tool detect both MockK and Mockito
    in the same file? YES. ProjectPageViewModelTest imports and uses both:
    - Mockito: Mockito.mock(SharedPreferences::class.java) + Mockito.when()
      (3 occurrences, all setup-only stubs) -> correctly detected as Mockito/SetupOnly
    - MockK: spyk() + coVerify{} + slot/capture (1 occurrence) -> correctly
      detected via ArgumentCaptor structural finding
    The tool handles dual-framework files correctly at the detection level.
    Usage classification is also correct: Mockito doubles are SetupOnly,
    MockK spyk triggers structural/verification classification.
