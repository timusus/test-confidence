# swift-composable-architecture (TCA) calibration — 5 test files from /tmp/tca
# Tool run: ./confidence scan /tmp/tca --platform ios --json > /tmp/scan-tca.json
# Focus: Swift Testing detection (@Suite, @Test, #expect), TestStore custom assertions,
#         macro snapshot testing, mixed XCTest + Swift Testing files

annotations:
  - file: "Tests/ComposableArchitectureTests/EffectCancellationIsolationTests.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: Pure Swift Testing file — entire file wrapped in #if canImport(Testing).
      Uses @Suite struct (not XCTestCase class) and @Test func (not func test*).
      Two test methods, each creating a TestStore, sending actions, and receiving
      state changes via store.send/store.receive. The receive closures assert state
      mutations ($0.value = 42) — these are behavioral output assertions. No mocks,
      no verify calls, no interaction verification. The inline @Reducer Feature struct
      is production code defined in the test file for isolation, not a test double.
      Tests would survive any internal refactoring of the effect cancellation mechanism
      as long as the reducer contract (send start -> receive response -> send stop) holds.

      Manual assertion count: 6. Each store.send and store.receive is an implicit
      assertion (TestStore verifies exhaustive action processing). Two sends + one
      receive per test = 3 per test, 6 total. The receive closures that mutate $0
      are state-diff assertions.
    tool_agrees: true
    disagreements:
      - signal: swift_testing_detection
        detail: |
          Tool correctly finds this file and reports 2 behavioral methods with 6
          assertions. This is a pure @Suite struct file with no XCTestCase class —
          the tool successfully detects Swift Testing test methods via @Test. Good.
      - signal: assertion_strength
        detail: |
          Tool rates all 6 as "Medium". These are TestStore send/receive calls which
          are effectively strong assertions (they verify exhaustive state transitions
          via CustomDump diffing). The "Medium" rating undervalues them — they are
          at least as strong as XCTAssertEqual. Minor issue.
      - signal: unclassified_statements
        detail: |
          Tool reports 2 unclassified statements. These are likely the TestStore
          initialization lines. Acceptable — setup code, not assertions.

  - file: "Tests/ComposableArchitectureTests/TestStoreTests.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: XCTest file (final class TestStoreTests: BaseTCATestCase) with 23 test
      methods. Tests exercise the TestStore API itself — effect concatenation, async
      effects, state equality validation, dependency overrides, receive predicates,
      case key paths, dismiss behavior, etc. No mocks or interaction verification.
      All assertions are behavioral: either explicit XCTAssertEqual/XCTAssertTrue/
      XCTAssertFalse or implicit via TestStore's send/receive exhaustive checking.
      The store.send/store.receive pattern with state mutation closures constitutes
      the primary assertion mechanism. XCTExpectFailure blocks are meta-testing
      (testing that TestStore correctly reports failures) — these are legitimate.

      Manual assertion count: The file has ~15 explicit XCTAssert* calls plus ~65
      implicit assertions via store.send/store.receive. Tool reports 80 total, which
      is reasonable. Several embedded @Reducer structs are test fixtures (production
      code defined inline for test isolation), not test doubles.

      Dependencies are injected via TestStore's withDependencies closure or
      store.dependencies mutations — this is dependency substitution at the boundary,
      not internal mocking. The Client DependencyKey at the bottom is a simple
      value-type fake, not a mock framework double.
    tool_agrees: true
    disagreements:
      - signal: god_test_class
        detail: |
          Tool flags GodTestClass anti-pattern. The file has 23 test methods — this
          is borderline. For a file that tests a single API surface (TestStore), having
          23 methods grouped in one class is reasonable. The anti-pattern flag is
          technically correct by count threshold but not concerning here. The tests
          are logically cohesive (all test TestStore behavior). Mild false positive.
      - signal: zero_assertion_methods
        detail: |
          Tool flags testAssert_NonExhaustiveTestStore_Failure (line 450) as zero-
          assertion. This method uses XCTExpectFailure wrapping store.assert, which
          means the assertion is the expected failure itself. The tool misses that
          XCTExpectFailure + store.assert is a valid assertion pattern. Detection gap.
      - signal: assertion_count
        detail: |
          Tool reports 80 total assertions. Manual count is roughly consistent.
          The tool correctly recognizes store.send and store.receive as assertion-
          bearing calls. The 67 "unclassified statements" are mainly TestStore setup,
          Reducer definitions, and XCTExpectFailure blocks.

  - file: "Tests/ComposableArchitectureTests/DebugTests.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: Pure XCTest file (final class DebugTests: BaseTCATestCase), 4 test
      methods. Wrapped in #if DEBUG. Tests the debug output formatting of reducers:
      testDebugCaseOutput verifies string representations of enum actions, the other
      three tests verify that the _ReducerPrinter captures expected log output when
      actions are sent. All assertions are output-based: XCTAssertEqual for string
      matching and expectNoDifference (CustomDump) for log output comparison.

      The _ReducerPrinter is a real framework type used as a callback/closure-based
      observer, not a mock. The LockIsolated<String> is a thread-safe accumulator
      collecting printed output — this is a capture pattern, not interaction verification.
      Tests verify what was printed (output), not that print was called (interaction).

      Manual assertion count: 4 XCTAssertEqual + 3 expectNoDifference = 7 strong
      assertions. Tool reports 13 total, which counts the XCTAssertEqual calls (4)
      plus the expectNoDifference calls (3) correctly, and appears to also count
      some store.send calls as implicit assertions, bringing the total higher.

      The Task.sleep calls are legitimate timing needs (waiting for async reducer
      processing), not flaky test anti-patterns. The XCTWaiter.wait in
      testDebugReducer_Order is a synchronization mechanism for testing concurrent
      reducer behavior.
    tool_agrees: true
    disagreements:
      - signal: thread_sleep
        detail: |
          Tool flags ThreadSleep at lines 62 and 142. These are Task.sleep(nanoseconds:)
          calls used to wait for async Store processing to complete before checking
          output. In TCA's architecture, this is a common pattern when testing
          non-TestStore Store behavior — you need to wait for effects to propagate.
          The testDebugReducer_Order method uses XCTWaiter.wait similarly. These are
          not flaky sleep-based assertions but necessary synchronization. The tool's
          detection is technically correct (sleep exists) but the severity is overstated
          for this codebase's idiom. The XCTWaiter.wait at line 95 is not flagged,
          which is inconsistent.
      - signal: assertion_strength
        detail: |
          Tool reports 9 Medium + 4 Strong. The 4 Strong are the XCTAssertEqual
          calls. The expectNoDifference calls are likely classified as Medium since
          they are a custom assertion. In practice, expectNoDifference is a stronger
          assertion than XCTAssertEqual (it provides structural diff output). Minor.

  - file: "Tests/ComposableArchitectureTests/StoreTests.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: Mixed XCTest + Swift Testing file. Lines 1-1307 are an XCTest class
      (final class StoreTests: BaseTCATestCase) with 33 test methods. Lines 1309-1416
      are a #if canImport(Testing) block containing @Suite struct ModernStoreTests
      with 2 @Test methods (cancellation, parentChildLifecycle in a nested @Suite).

      The XCTest portion tests Store behavior: scoping, effect cancellation, dependency
      injection, re-entrant actions, publisher lifecycle, task cancellation, and
      presentation scope. All assertions are behavioral — XCTAssertEqual on state
      values, store.withState checks, effectCancellables.count checks. Many deprecated
      ViewStore tests remain for backwards compatibility testing.

      The Swift Testing portion (ModernStoreTests) tests Store with #expect assertions.
      cancellation() creates a Store, sends an action, checks state with #expect,
      and uses withKnownIssue for a known limitation. parentChildLifecycle() tests
      Store memory management with weak references and #expect(parentStore == nil).

      Manual method count: 33 XCTest + 2 Swift Testing = 35 total.
      Manual assertion count: ~80 XCTAssertEqual + ~20 store.send/receive + ~5 #expect
      + ~4 XCTAssertNil/NotNil = ~109. Tool reports 109, which matches.

      TestClock and DispatchQueue.test are test scheduling fakes (time control), not
      mocks. PassthroughSubject is used as a controllable event source. Dependencies
      are injected via withDependencies closures — boundary substitution pattern.
    tool_agrees: true
    disagreements:
      - signal: swift_testing_detection
        detail: |
          Tool correctly detects all 35 methods (33 XCTest + 2 Swift Testing).
          The anti-pattern list includes "cancellation" (the @Test method) flagged
          for ThreadSleep. This confirms the tool parses both class-based XCTestCase
          and struct-based @Suite in the same file. Good detection.
      - signal: god_test_class
        detail: |
          Tool flags GodTestClass for StoreTests (33 XCTest methods). This is
          accurate by count — 33 methods is a large test class. However, all methods
          test a single type (Store) and are logically cohesive. The tool does not
          appear to separately flag ModernStoreTests, which is correct (only 2 methods).
      - signal: assertion_roulette
        detail: |
          Tool flags testScopeCallCount_ThreeLevels_ViewStoreSubscribing (line 169)
          and testPresentationScope (line 944). These have many consecutive
          XCTAssertEqual calls checking counter variables. The flag is appropriate —
          these tests have 18+ assertions with no message strings, making failure
          diagnosis harder. Correct detection.
      - signal: thread_sleep
        detail: |
          Tool flags 4 ThreadSleep instances. Lines 854/859 (testChildParentEffectCancellation)
          use Task.sleep for async propagation — legitimate synchronization in TCA.
          Line 1070 (testReEntrantAction) similarly. Line 1248 (testRootStoreCancellationIsolation)
          uses Task.sleep(for:) to wait for effect processing. Line 1345 is in the
          Swift Testing @Test method. These are all necessary async timing, not flaky
          patterns. Technically correct flags but low severity in this context.
      - signal: zero_assertion_methods
        detail: |
          Tool flags 3 zero-assertion methods. testOverrideDependenciesDirectlyOnReducer
          (line 623) sends an action via ViewStore but never asserts — it only verifies
          the reducer runs without crashing. This IS genuinely assertion-free; fair flag.
          testPublisherAsyncSequence (line 1189) uses async iteration without assertions;
          fair flag. testRootStoreCancellationIsolation_TestStore (line 1257) uses
          TestStore send/receive which ARE assertions — this is a false negative for
          assertion detection. The store.receive(\.response) { $0.count = 42 } at
          line 1273 is an assertion the tool may be missing because it is in the
          #if canImport(Testing) adjacent block but belongs to the XCTest class.
          Actually, re-reading: this method IS in the StoreTests XCTest class (before
          the #if canImport block), so the tool should count its store.receive as an
          assertion. Detection gap.
      - signal: doubles_detection
        detail: |
          Tool detects 5 fakes: 2 testStore instances and 3 TestClock instances.
          The testStore detection as "Fake" with "Internal" placement is questionable —
          TestStore is a testing harness, not a double of a production type. It should
          not be classified as a test double at all. TestClock as a fake with
          "UnknownPlacement" is more reasonable — it IS a fake clock, though placement
          is boundary (it substitutes the continuousClock dependency). The tool
          misclassifies TestStore as a test double. This inflates the fake count.

  - file: "Tests/ComposableArchitectureMacrosTests/ReducerMacroTests.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: XCTest file (final class ReducerMacroTests: XCTestCase) with 26 test
      methods. Entirely wrapped in #if canImport(ComposableArchitectureMacros).
      Uses MacroTesting library's assertMacro { } expansion: { } / diagnostics: { }
      / fixes: { } pattern — a snapshot-style assertion that compares macro expansion
      output against expected strings.

      Every test follows the same pattern: call assertMacro with Swift source code
      as input, then verify the expanded output matches an expected string. This is
      purely behavioral — it tests "given this input, the macro produces this output."
      No mocks, no interaction verification, no doubles. The invokeTest() override
      configures withMacroTesting context (sets the macro under test) — this is test
      infrastructure setup, not mocking.

      The assertMacro calls are strong assertions: they do full string comparison of
      generated code. Failures produce diff output showing exactly what changed.
      Tests cover: basics, enum state, already-applied attributes, existing conformances,
      reduce method diagnostics, empty enums, enum cases, access control variants,
      nested structures, conditional compilation (#if), observer pattern, and more.

      These tests are NOT fragile despite testing generated output — macro expansion
      is the product's contract. If the output changes, the test SHOULD fail. This is
      analogous to golden file testing for a code generator.
    tool_agrees: true
    disagreements:
      - signal: god_test_class
        detail: |
          Tool flags GodTestClass for 26 test methods. All methods test a single
          macro (ReducerMacro) with different input configurations. This is a standard
          parameterized-by-hand pattern for macro testing. The flag is technically
          correct by count but not a real concern — the class is highly cohesive.
      - signal: assertion_count
        detail: |
          Tool reports 26 assertions, matching the 26 test methods (one assertMacro
          per test). This is correct — each assertMacro call is one logical assertion
          even though it may compare multiple blocks (expansion, diagnostics, fixes).
          Tool correctly recognizes assertMacro as an assertion-bearing call.
      - signal: assertion_strength
        detail: |
          Tool rates all 26 as "Medium". assertMacro performs full string-diff
          comparison of generated Swift code — this is effectively a "Strong" assertion
          (exact equality of multi-line strings). The "Medium" classification
          undervalues the assertion strength. The MacroTesting library's assertMacro
          is not in the tool's known-strong assertion list. Detection gap for
          third-party assertion libraries.
      - signal: unclassified_statements
        detail: |
          Tool reports 0 unclassified statements, which seems low. The invokeTest
          override and withMacroTesting setup should count as setup complexity. The
          tool may not be parsing the invokeTest override as test setup. Minor.

summary:
  total_files: 5
  tool_detection_rate: "5/5 — all files found and analyzed"
  swift_testing_findings: |
    The tool successfully detects Swift Testing files:
    - EffectCancellationIsolationTests.swift: Pure @Suite struct with @Test methods,
      wrapped in #if canImport(Testing). Tool finds both methods and correctly
      classifies them as behavioral. No XCTestCase class in this file at all.
    - StoreTests.swift: Mixed file with XCTestCase class + #if canImport(Testing)
      block containing @Suite struct. Tool detects all 35 methods (33 + 2) and
      correctly reports anti-patterns from the Swift Testing section.
    Conclusion: Swift Testing detection works for both pure and mixed files.
  teststore_assertion_detection: |
    TestStore's store.send() and store.receive() are correctly recognized as
    assertion-bearing calls throughout. The tool counts them toward the total
    assertion count and uses them for behavioral classification. One edge case:
    testRootStoreCancellationIsolation_TestStore is flagged as zero-assertion
    despite containing store.send/store.receive calls — possible detection gap.
  key_disagreements:
    - "TestStore instances classified as Fake doubles — TestStore is a test harness, not a double"
    - "assertMacro rated as Medium strength — it is effectively Strong (exact string diff)"
    - "Task.sleep flags are technically correct but low-severity in TCA's async testing idiom"
    - "GodTestClass flags on cohesive single-type test classes are noise for this codebase"
  overall_accuracy: |
    High. The tool correctly classifies all 5 files as behavioral with low structural
    coupling and zero structural methods. Assertion counts are reasonable. The main
    gaps are: (1) assertion strength undervaluation for custom assertions (assertMacro,
    expectNoDifference, TestStore send/receive), (2) TestStore misclassified as a
    fake double, and (3) GodTestClass flags on cohesive test classes. No false
    structural classifications. No missed files. Swift Testing support is solid.
