  - file: "app/src/test/java/com/example/android/architecture/blueprints/todoapp/statistics/StatisticsUtilsTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: >
      Expert: Pure unit test of a utility function (getActiveAndCompletedStats).
      No dependencies, no setup, no doubles. Tests are input->output with Hamcrest
      matchers. Best possible test design for pure functions.

      Tool output: behavioral=100%, structuralCouplingScore=0, fakeCount=0,
      8 assertions (all Medium), scope=Local, setupComplexity=0.

      Assessment: Tool correctly identifies this as fully behavioral. However,
      the assertion strength is all Medium, which undervalues these tests.
      The Hamcrest `assertThat(result.field, is(100f))` pattern IS equality
      checking (equivalent to assertEquals), but the tool sees the root call
      as assertThat with no chained navigation, and the `is` matcher is passed
      as an argument, not a terminal method. So it defaults to Medium.
    tool_agrees: true
    disagreements:
      - signal: "assertion_strength"
        tool_says: "8 Medium assertions"
        expert_says: "All 8 are equality assertions via Hamcrest is() matcher. Should be Strong. The tool cannot analyze Hamcrest matcher arguments, so it correctly defaults to Medium. This is a known detection limit for Hamcrest-style assertions."
        severity: "minor (systematic undercount of Hamcrest assertion strength)"

  - file: "app/src/test/java/com/example/android/architecture/blueprints/todoapp/data/DefaultTaskRepositoryTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: boundary
    notes: >
      Expert: Repository test using FakeNetworkDataSource + FakeTaskDao. Tests
      the caching, syncing, and CRUD behavior of DefaultTaskRepository through
      its public API. All assertions check return values (getTasks(), getTask()).
      Two tests use expected= exception annotation. Fakes are at the data boundary
      (network and local storage). Would survive most refactors. High confidence.

      Tool output: behavioral=100%, structuralCouplingScore=0, fakeCount=2
      (FakeNetworkDataSource=Boundary, FakeTaskDao=Boundary), 25 assertions
      (16 Strong, 9 Medium), scope=Local, setupComplexity=0.

      Assessment: Tool is largely correct. The fake detection and boundary
      placement are accurate. The assertion count of 25 matches my manual
      count. However, two tests use @Test(expected = Exception::class) which
      aren't counted as assertions -- the tool misses these because they're
      annotation-based, not call-based. This means 2 implicit assertions are
      uncounted. Also, line 112-113 have a subtle bug in the source: assertThat()
      is called without a terminal assertion method (no .isTrue()), making
      those assertions actually no-ops. The tool counts them as assertions anyway
      because the text-based fallback sees "assertThat(" in the text.
    tool_agrees: true
    disagreements:
      - signal: "assertion_count"
        tool_says: "25 assertions"
        expert_says: "23 real assertions + 2 no-op assertThat calls (lines 112-113, missing terminal .isTrue()). The tool should detect assertThat() without a terminal assertion as a potential issue. Also 2 expected-exception annotations are not counted."
        severity: "minor (2 false positives from no-op assertThat, 2 missed annotation-based assertions)"

