# Calibration: Element X iOS
# Codebase: /tmp/element-x-ios
# Date: 2026-03-21
# Tool version: confidence (current main branch)
#
# Element X iOS is a production Matrix chat client using modern Swift patterns.
# Testing patterns observed:
#   - Swift Testing framework (@Test, #expect, @Suite, struct-based test suites) is the PRIMARY
#     unit testing framework, used pervasively across UnitTests/
#   - XCTest (XCTestCase subclasses) used for UI tests in UITests/
#   - SnapshotTesting (assertSnapshot) used in compound-ios submodule for preview snapshot tests
#   - Generated test code (Sourcery) produces snapshot tests as extensions on struct-based suites
#   - Combine publishers tested via deferFulfillment pattern (custom async helper)
#   - Generated protocol mocks (AudioPlayerMock etc.) with property-based recording
#     (e.g. .stopCalled, .seekToReceivedProgress) -- these are Sourcery-generated mocks
#   - Issue.record() used as Swift Testing equivalent of XCTFail
#
# CRITICAL FINDING: The tool does not recognize #expect() as an assertion. All Swift Testing
# files have severely undercounted assertions. Methods using only #expect are reported as
# "zero assertion methods". This is the dominant gap for this codebase.

annotations:
  - file: "UnitTests/Sources/RoomSummaryTests.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: Pure behavioral test suite using Swift Testing (struct-based, @Test, #expect).
      Tests the RoomSummary avatar computation logic -- given different combinations of
      isDirect/isSpace/hasRoomAvatar/isTombstoned, verifies the correct .avatar enum case
      is produced with the correct associated values. Uses switch statements to pattern-match
      on the result enum, asserting associated values with #expect and using Issue.record()
      for unexpected cases. No mocks, no doubles -- just constructs a RoomSummary via a
      helper and asserts its output. The switch/case pattern is idiomatic for exhaustive
      enum testing in Swift, not conditional test logic.

      Manual assertion count: 11 #expect assertions across 5 test methods.
      Per method: roomAvatar=3, dmAvatarSet=3, dmAvatarNotSet=1, spaceAvatar=3, tombstonedAvatar=1.
      Additionally, Issue.record() is used as a failure assertion (4 cases per switch method).

      Tool output: File IS found. Reports 4 totalAssertions, 4 behavioralMethods, 1 unclassifiedMethod.
      Reports tombstonedAvatar as zero-assertion method. Reports 4 ConditionalLogic anti-patterns.
      structuralCouplingScore=0, mockDensity=0, outputInteractionRatio=1.

      Assessment: The tool finds the file (struct-based suite detected) but severely undercounts
      assertions. 4 vs 11 real #expect calls -- the tool misses ~64% of assertions because
      #expect() is not recognized as an assertion macro. tombstonedAvatar has 1 #expect
      (line 92: #expect(details.avatar == .tombstoned)) but is reported as zero-assertion.
      The ConditionalLogic findings on switch statements are a false positive -- these are
      exhaustive enum pattern matches, which is the standard Swift idiom for testing enum
      results. The behavioral/structural classification is correct (all behavioral, no
      structural coupling), and mock_placement=none is correct.
    tool_agrees: false
    disagreements:
      - signal: "assertion_count"
        tool_says: "4 total assertions"
        expert_says: "11 #expect assertions (plus Issue.record failure calls)"
        severity: "critical"
      - signal: "zero_assertion_methods"
        tool_says: "tombstonedAvatar is zero-assertion"
        expert_says: "tombstonedAvatar has 1 #expect assertion at line 92"
        severity: "significant"
      - signal: "anti_pattern_conditional_logic"
        tool_says: "4 ConditionalLogic anti-patterns (lines 22, 40, 58, 74)"
        expert_says: "These are switch statements on result enums -- standard exhaustive enum testing in Swift, not conditional test logic. The pattern is: assert correct case with #expect, Issue.record for unexpected cases."
        severity: "moderate"
      - signal: "unclassified_methods"
        tool_says: "1 unclassified method"
        expert_says: "All 5 methods are behavioral (output assertions on a computed property). The 1 unclassified is tombstonedAvatar which has a #expect the tool missed."
        severity: "moderate"

  - file: "compound-ios/Tests/CompoundTests/PreviewTests.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: Snapshot testing infrastructure file using Swift Testing (struct-based suite,
      import Testing). This file defines the PreviewTests struct with helper methods
      (assertSnapshots) that wrap SnapshotTesting's verifySnapshot. It does NOT contain
      @Test methods itself -- it is the base struct that GeneratedPreviewTests.swift extends
      with @Test methods. The assertSnapshots method calls verifySnapshot internally and
