# Moya calibration — 5 test files from /tmp/moya/Tests/MoyaTests
# Tool run: ./confidence scan /tmp/moya --platform ios --json
#
# CRITICAL DETECTION GAP: The tool reports 0 test files, 0 test methods.
# Every file below was completely invisible to the tool.
#
# Root cause: Moya uses Quick/Nimble for all tests. Quick specs subclass
# QuickSpec (not XCTestCase directly), and test methods are defined as
# it("description") { ... } blocks nested inside describe/context scopes.
# The tool's test file discovery looks for XCTestCase subclasses and
# func test*() method signatures — neither pattern exists in Quick specs.
#
# What the tool needs to recognize:
#   - QuickSpec as a test base class (equivalent to XCTestCase)
#   - it("...") { } as a test method (equivalent to func testFoo())
#   - describe("...") { } and context("...") { } as organizational scopes
#   - itBehavesLike("...") as shared example invocations (also test methods)
#   - Nimble matchers as assertions:
#       expect(x).to(equal(y))          — strong equality
#       expect(x).toNot(beNil())        — nil check
#       expect(x).to(beTrue())          — boolean check
#       expect(x).to(contain("..."))    — containment check
#       expect(x) == y                  — operator overload equality
#       expect(x) != y                  — operator overload inequality
#       expect(x).to(beOfSameErrorType(y))  — custom matcher
#       expect(x).to(beIdenticalToResponse(y)) — custom matcher
#       expect(x).toEventually(equal(y))    — async matcher
#       expect(x).to(throwAssertion())      — assertion-throws matcher

annotations:
  - file: "MoyaTests/EndpointSpec.swift"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: |
      Expert: 57 it() blocks testing Moya's Endpoint value type. The tool found
      NOTHING — zero test files, zero methods. This is a complete discovery failure.

      What SHOULD be detected:
      - Test class: EndpointSpec (QuickSpec subclass), plus 2 QuickConfiguration
        subclasses (NonUpdatingRequestEndpointConfiguration, ParametersEncodedEndpointConfiguration)
        that define sharedExamples reused via itBehavesLike().
      - 57 it() blocks = 57 test methods.
      - ~120+ Nimble assertions: expect(...).to(equal(...)), expect(...).to(beNil()),
        expect(...) == ..., expect(...) != ... operators.
      - Zero mocks or test doubles. All tests create real Endpoint values, call
        real methods (replacing(task:), urlRequest(), adding(newHTTPHeaderFields:)),
        and assert on the returned values.
      - Classification: purely behavioral. Tests verify the Endpoint's public API
        contract — URL construction, header merging, body encoding, parameter encoding,
        error cases, and Equatable conformance. No interaction verification whatsoever.
      - Error path coverage: tests for invalid URLs (.requestMapping), bad parameter
        encoding (.parameterEncoding), invalid JSON encoding (.encodableMapping).
        Error assertions use custom Nimble matcher beOfSameErrorType().
      - Equatable tests (lines 391-666): extensive equality/inequality checks across
        all Task enum cases. Every test constructs two endpoints and asserts == or !=.
        These are high-value behavioral tests that protect the Equatable contract.
      - Conditional compilation: #if !SWIFT_PACKAGE guards 3 throwAssertion() tests
        that verify debug assertions fire for invalid URLEncoding configurations.
    tool_agrees: false
    disagreements:
      - signal: discovery_failure
        detail: |
          Tool reports 0 test files, 0 test methods. The file contains 57 it() blocks
          with ~120+ assertions across a QuickSpec subclass and 2 QuickConfiguration
          shared example providers. This is a complete detection failure caused by the
          tool not recognizing QuickSpec as a test base class or it() as a test method.
      - signal: classification
        detail: |
          Should be classified as 100% behavioral. Every test creates real Endpoint
          values, calls public API methods, and asserts on returned data. Zero mocks,
          zero verify calls, zero interaction assertions. These tests are resilient
          to internal refactoring — they only break if the public Endpoint contract
          changes.
      - signal: assertion_detection
        detail: |
          Tool should detect Nimble assertions: expect().to(equal()), expect().to(beNil()),
          expect() == (operator overload), expect() != (operator overload),
          expect().to(beOfSameErrorType()), expect().to(throwAssertion()).
          All assertions are strong (equality or type-matching). None are weak.

