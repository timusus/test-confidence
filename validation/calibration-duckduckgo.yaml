# CRASH BUG: The tool panics with a nil pointer dereference when scanning
# this codebase. The crash occurs in:
#
#   internal/parse/kotlin_helpers.go:439  findLambda()
#     called from:
#   internal/parse/kotlin_helpers.go:271  ExtractCallTarget()
#     called from:
#   internal/analyze/structural.go:101   detectStubAndVerify()
#
# Root cause: ExtractCallTarget receives a node of type "infix_expression"
# (from Mockito-Kotlin's `whenever(...).thenReturn(...)` chained calls).
# When the first child of the infix_expression is NOT a "call_expression",
# the variable `callExpr` remains zero-value (model.ASTNode with nil Node
# field). Control falls through to line 271 where findLambda(callExpr) is
# called, and findLambda dereferences callExpr.Node at line 439, causing
# the nil pointer panic.
#
# The fix is to add a nil guard in ExtractCallTarget before calling
# findLambda, e.g.:
#   if callExpr.Node == nil {
#       return "", ""
#   }
#
# DuckDuckGo Android is a large Kotlin Android app using Mockito-Kotlin
# (org.mockito.kotlin) as its primary mocking framework, along with
# Robolectric for Android framework tests, Turbine for Flow testing,
# and Espresso for instrumentation tests. The Mockito-Kotlin pattern
# of `whenever(mock.method()).thenReturn(value)` and `verify(mock).method()`
# is used throughout and is the pattern that triggers the crash.

