  - file: "app/src/androidTest/kotlin/com/wire/android/ui/common/UserProfileAvatarTest.kt"
    behavioral: true
    structural_coupling: low
    fragile: false
    mock_placement: none
    notes: >
      Expert: Compose UI test with 6 @Test methods. Uses createComposeRule() to
      render UserProfileAvatar with various configurations and asserts on UI node
      visibility. No mocks at all -- uses real Compose rendering. The helper
      method testIndicators() sets Compose content and calls assertNode() 3 times
      (checking status indicator, legal hold indicator, and temporary user
      indicator). assertNode() delegates to either assertIsDisplayed() or
      assertDoesNotExist(). Manual assertion count: Each test calls
      testIndicators which makes 3 assertNode calls = 3 assertions per test.
      6 tests x 3 assertions = 18 assertion executions. However, the assertion
      call sites in the source are: assertNode is called at lines 61, 62, 63
      inside testIndicators. That is 3 unique call sites in the helper, invoked
      6 times. If the tool counts call sites per test method, it would be 18.
      If it only counts unique call sites in the helper, it would be 3. The tool
      reports 0 assertions, which means it does not recognize the Compose
      testing assertions (assertIsDisplayed, assertDoesNotExist) or does not
      follow the helper method indirection. This is a significant miss. The
      6 behavioralMethods count is correct, meaning the tool recognizes the
      @Test annotations. But with 0 assertions detected, those 6 methods are
      being classified as behavioral with no assertions, which is misleading.
      Scope=Device is correct (androidTest source set with Compose test rule).

      Tool output: totalAssertions=0, behavioralMethods=6, structuralMethods=0,
      structuralCouplingScore=0, scope=Device, setupComplexity ratio=0,
      mockDensity=0.

      Assessment: The tool correctly identifies scope as Device, correctly finds
      6 test methods, correctly reports no mocks and no structural coupling.
      However, it reports 0 assertions which is wrong -- there are 18 assertion
      executions (3 per test via the testIndicators helper). The Compose test
      assertions (assertIsDisplayed, assertDoesNotExist) are apparently not
      recognized. This is documented behavior per DESIGN.md ("Compose test file
      note: assertions not fully analyzed"), so the tool is being transparent
      about its limitation. The 6 unclassifiedStatements likely correspond to
      the 6 test method bodies whose assertions cannot be parsed.
    tool_agrees: true
    disagreements:
      - signal: "assertion_count"
        tool_says: "0 assertions detected"
        expert_says: "18 assertion executions across 6 tests (3 Compose assertions per test via helper: assertIsDisplayed and assertDoesNotExist). The tool does not detect Compose testing assertions. This is a known limitation per DESIGN.md."
        severity: "moderate (known limitation, but still a significant undercount for Compose UI tests)"
      - signal: "setup_complexity"
        tool_says: "setupStatements=1, ratio=0"
        expert_says: "Each test configures Compose content with setContent{} and passes parameters. The setup is non-trivial (composeTestRule.setContent with theme wrapper and component configuration). 1 setup statement seems like an undercount but is acceptable given the DSL-style setup."
        severity: "minor (Compose DSL setup is hard to count as discrete statements)"
